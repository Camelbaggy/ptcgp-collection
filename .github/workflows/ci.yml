name: ci

# Contrôles avant fusion : une PR cassée ne doit pas arriver sur main (le déploiement part au push).
# Rendre le contrôle « ci » obligatoire dans Settings → Rules (voir CLAUDE.md §7).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npx tsc -b
      - name: Tests
        run: npx vitest run
      - name: Lint
        run: npx oxlint --deny-warnings
      - name: Build
        run: npx vite build
        env:
          BASE_PATH: /ptcgp-collection/
      - name: Navigateur pour les tests E2E
        run: npx playwright install --with-deps chromium
      - name: Tests E2E de fumée + accessibilité
        run: npx playwright test
        env:
          CI: 'true'
      - name: Mesure de l'interface (non bloquant)
        continue-on-error: true
        run: npm run ui:audit -- --out ui-audit
      - name: Rapport de mesure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: ui-audit/
          retention-days: 14
          if-no-files-found: ignore
      - name: Rapport E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
