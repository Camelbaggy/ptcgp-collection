name: Debug emblems
on:
  push:
    branches: [debug/emblems]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm i --no-save sharp
      - run: curl -sL -A "Mozilla/5.0" https://www.serebii.net/tcgpocket/emblems.shtml | iconv -f latin1 -t utf-8 | sed -n '/List of Set Based Emblems/,/<\/main>/p' | sed 's/<tr>/\n<tr>/g' | sed "s/^/PAGE| /"
