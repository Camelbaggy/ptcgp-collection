name: Debug schedule
on:
  push:
    branches: [debug/schedule]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          for p in events dropevents wonderpickevents emblemevents massoutbreakevents index; do curl -sL -A "Mozilla/5.0" "https://www.serebii.net/tcgpocket/$p.shtml" | iconv -f latin1 -t utf-8 > out/$p.html; done
          curl -sL -A "Mozilla/5.0" "https://www.serebii.net/tcgpocket/" | iconv -f latin1 -t utf-8 > out/home.html
          ls -la out
          for f in out/*.html; do echo "FILE $f"; base64 -w0 < <(gzip -9c $f); echo; done | sed 's/^/PAGE| /'
