name: Debug schedule
on:
  push:
    branches: [debug/schedule]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -A "Mozilla/5.0" https://www.serebii.net/tcgpocket/ | iconv -f latin1 -t utf-8 | grep -o 'href="[^"]*"[^<]*<[^>]*>[^<]*' | grep -i "event\|schedul\|calend\|upcoming\|campaign\|news" | head -40 | sed 's/^/PAGE| /'
          for u in https://www.serebii.net/tcgpocket/events.shtml https://www.serebii.net/tcgpocket/upcomingevents.shtml https://tcgpocket.pokemon.com/fr-fr/news/ https://tcgpocket.pokemon.com/en-us/news/; do echo "PAGE| === $u $(curl -sL -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' $u)"; done
