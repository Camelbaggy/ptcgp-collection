name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'   # 7h Paris (summer)
    - cron: '0 6 * * *'   # 7h Paris (winter)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci   # sharp is a devDependency, installed here

      - run: npx vitest run

      # Card images are not committed: downloaded from TCGdex, resized, cached between runs.
      - name: Cache card images
        uses: actions/cache@v4
        with:
          path: public/cards
          key: cards-${{ hashFiles('public/data/cards.json') }}
          restore-keys: cards-

      - name: Fetch card images (individual 404s are not fatal)
        run: node scripts/fetch-images.mjs --all --cards public/data/cards.json
        # Optional 2nd source if TCGdex fails: set repository variable IMAGE_FALLBACK_URL_TEMPLATE
        # e.g. https://host/{set}/{n3}.webp  ({set} {num} {n3} are replaced)
        env:
          FALLBACK_URL_TEMPLATE: ${{ vars.IMAGE_FALLBACK_URL_TEMPLATE || 'https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/pocket/{set}/{set}_{n3}_EN.webp' }}

      # Set logos (Pokepedia) and booster emblems (Serebii): cached, never block the deploy.
      - name: Cache logos and emblems
        uses: actions/cache@v4
        with:
          path: |
            public/logos
            public/emblems
            public/packs
          key: assets-${{ hashFiles('public/data/sets.json', 'public/data/boosters.json', 'scripts/fetch-logos.mjs', 'scripts/fetch-emblems.mjs', 'scripts/fetch-pack-images.mjs') }}
          restore-keys: assets-

      - name: Fetch set logos (missing ones are not fatal)
        continue-on-error: true
        run: node scripts/fetch-logos.mjs

      - name: Fetch booster emblems (unmatched ones are not fatal)
        continue-on-error: true
        run: node scripts/fetch-emblems.mjs

      # Booster pack artwork (Pokekalos, robots.txt allows it): throttled, cached, never blocks the deploy.
      - name: Fetch booster pack images (missing ones are not fatal)
        continue-on-error: true
        run: node scripts/fetch-pack-images.mjs

      # Item icons (hourglasses, tickets, emblems) from Serebii for the event sheets: cached, throttled, never block the deploy.
      - name: Cache item icons
        uses: actions/cache@v4
        with:
          path: |
            public/items
            public/data/item-icons.json
          key: item-icons-${{ hashFiles('scripts/fetch-item-icons.mjs') }}
          restore-keys: item-icons-

      - name: Fetch item icons (not fatal)
        continue-on-error: true
        run: node scripts/fetch-item-icons.mjs

      # Pokédex sprites (PokeAPI/sprites on GitHub): cached, never block the deploy (the UI shows a placeholder when missing).
      - name: Cache Pokédex sprites
        uses: actions/cache@v4
        with:
          path: public/sprites
          key: sprites-${{ hashFiles('public/data/pokedex.json', 'scripts/fetch-sprites.mjs') }}
          restore-keys: sprites-

      - name: Fetch Pokédex sprites (not fatal)
        continue-on-error: true
        run: node scripts/fetch-sprites.mjs

      # Méta tier list (Limitless). Never fatal: on failure the previous deployed meta.json is kept.
      - name: Fetch meta tier list
        continue-on-error: true
        run: node scripts/fetch-meta.mjs

      - name: Image summary
        run: |
          echo "images: $(find public/cards -name '*.webp' | wc -l)"
          du -sh public/cards || true
          echo "logos: $(find public/logos -name '*.webp' 2>/dev/null | wc -l), emblems: $(find public/emblems -name '*.webp' 2>/dev/null | wc -l), packs: $(find public/packs -name '*.webp' 2>/dev/null | wc -l), item icons: $(find public/items -name '*.png' 2>/dev/null | wc -l), sprites: $(find public/sprites -name '*.png' 2>/dev/null | wc -l)"

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /ptcgp-collection/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
