name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci   # sharp is a devDependency, installed here

      - run: npx vitest run

      # Card images are not committed: downloaded from TCGdex, resized, cached between runs.
      - name: Cache card images
        uses: actions/cache@v4
        with:
          path: public/cards
          key: cards-${{ hashFiles('public/data/cards.json') }}
          restore-keys: cards-

      - name: Fetch card images (individual 404s are not fatal)
        run: node scripts/fetch-images.mjs --all --cards public/data/cards.json
        # Optional 2nd source if TCGdex fails: set repository variable IMAGE_FALLBACK_URL_TEMPLATE
        # e.g. https://host/{set}/{n3}.webp  ({set} {num} {n3} are replaced)
        env:
          FALLBACK_URL_TEMPLATE: ${{ vars.IMAGE_FALLBACK_URL_TEMPLATE || 'https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/pocket/{set}/{set}_{n3}_EN.webp' }}

      # Set logos (Pokepedia) and booster emblems (Serebii): cached, never block the deploy.
      - name: Cache logos and emblems
        uses: actions/cache@v4
        with:
          path: |
            public/logos
            public/emblems
            public/packs
          key: assets-${{ hashFiles('public/data/sets.json', 'public/data/boosters.json', 'scripts/fetch-logos.mjs', 'scripts/fetch-emblems.mjs', 'scripts/fetch-pack-images.mjs') }}
          restore-keys: assets-

      - name: Fetch set logos (missing ones are not fatal)
        continue-on-error: true
        run: node scripts/fetch-logos.mjs

      - name: Fetch booster emblems (unmatched ones are not fatal)
        continue-on-error: true
        run: node scripts/fetch-emblems.mjs

      # Booster pack artwork (Pokekalos, robots.txt allows it): throttled, cached, never blocks the deploy.
      - name: Fetch booster pack images (missing ones are not fatal)
        continue-on-error: true
        run: node scripts/fetch-pack-images.mjs

      # Item icons (hourglasses, tickets, emblems) from Serebii for the event sheets: cached, throttled, never block the deploy.
      - name: Cache item icons
        uses: actions/cache@v4
        with:
          path: |
            public/items
            public/data/item-icons.json
          key: item-icons-${{ hashFiles('scripts/fetch-item-icons.mjs') }}
          restore-keys: item-icons-

      - name: Fetch item icons (not fatal)
        continue-on-error: true
        run: node scripts/fetch-item-icons.mjs

      # Pokédex sprites (PokeAPI/sprites on GitHub): cached, never block the deploy (the UI shows a placeholder when missing).
      - name: Cache Pokédex sprites
        uses: actions/cache@v4
        with:
          path: public/sprites
          key: sprites-${{ hashFiles('public/data/pokedex.json', 'scripts/fetch-sprites.mjs') }}
          restore-keys: sprites-

      - name: Fetch Pokédex sprites (not fatal)
        continue-on-error: true
        run: node scripts/fetch-sprites.mjs

      # Données Limitless de l'écran Méta : calculées par update-meta.yml (branche data), lues en ligne
      # par l'appli ; ici seulement une copie embarquée pour le hors connexion. Jamais bloquant.
      - name: Offline copy of meta.json (not fatal)
        continue-on-error: true
        run: curl -fsS --max-time 30 https://raw.githubusercontent.com/${{ github.repository }}/data/meta.json -o public/data/meta.json

      # Empreintes d'illustration (reconnaissance des cartes sur capture / vidéo). Jamais bloquant.
      - name: Card fingerprints (not fatal)
        continue-on-error: true
        run: node --experimental-strip-types scripts/build-fingerprints.mjs

      - name: Image summary
        run: |
          echo "images: $(find public/cards -name '*.webp' | wc -l)"
          du -sh public/cards || true
          echo "logos: $(find public/logos -name '*.webp' 2>/dev/null | wc -l), emblems: $(find public/emblems -name '*.webp' 2>/dev/null | wc -l), packs: $(find public/packs -name '*.webp' 2>/dev/null | wc -l), item icons: $(find public/items -name '*.png' 2>/dev/null | wc -l), sprites: $(find public/sprites -name '*.png' 2>/dev/null | wc -l)"

      # Les téléchargements sont « jamais bloquants » : ce bilan signale (issue) une chute du nombre de fichiers.
      - name: Download health check (opens an issue, never blocks)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cards=$(node -p "require('./public/data/cards.json').filter(c=>c.number!==0 && c.number>0).length")
          node scripts/pipeline-check.mjs --out "$RUNNER_TEMP/dl.md" --title "Le déploiement ${GITHUB_SHA::7} a reçu moins de fichiers que prévu." \
            --counts "cards=$(find public/cards -name '*.webp' | wc -l)" --expected "cards=$cards"
          if [ -s "$RUNNER_TEMP/dl.md" ]; then
            gh label create pipeline-health --color D93F0B 2>/dev/null || true
            open=$(gh issue list --label pipeline-health --state open --json number --jq '.[0].number // empty')
            if [ -n "$open" ]; then gh issue comment "$open" --body-file "$RUNNER_TEMP/dl.md"
            else gh issue create --label pipeline-health --title "Pipelines : anomalie détectée" --body-file "$RUNNER_TEMP/dl.md"; fi
          fi

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /ptcgp-collection/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      # Bundle web pour l'appli Android (Capacitor) : mise à jour à distance sans réinstaller l'APK.
      # Même code, cible android (sans service worker), base « / ». Les images lourdes restent distantes.
      # Jamais bloquant pour le déploiement Pages.
      - name: App bundle for the Android app (not fatal)
        continue-on-error: true
        env:
          VITE_TARGET: android
          BASE_PATH: /
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          set -e
          # version = commit (les données Limitless sont lues en ligne, pas dans le bundle)
          VERSION="${GITHUB_SHA::7}"
          APP_BUNDLE_VERSION="$VERSION" npx vite build --outDir dist-app --emptyOutDir
          rm -rf dist-app/cards dist-app/packs dist-app/sprites dist-app/items dist-app/events
          test -f dist-app/index.html
          (cd dist-app && zip -qr ../dist/app-bundle.zip .)
          # SHA-256 du zip : exigé par @capgo/capacitor-updater pour un téléchargement manuel
          SUM=$(sha256sum dist/app-bundle.zip | cut -d' ' -f1)
          printf '{"version":"%s","url":"https://camelbaggy.github.io/ptcgp-collection/app-bundle.zip","date":"%s","checksum":"%s"}\n' \
            "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SUM" > dist/app-version.json
          ls -la dist/app-bundle.zip
          cat dist/app-version.json

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
