name: probe-fp
on:
  push:
    branches: [debug/video-fp]
permissions:
  contents: write
jobs:
  fp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/fetch-images.mjs --all --cards public/data/cards.json
      - run: node --experimental-strip-types scripts/build-fingerprints.mjs
      - run: |
          mkdir -p probe-out
          cp public/data/fingerprints.json probe-out/fingerprints.json
          git config user.name probe; git config user.email probe@example.com
          git add -f probe-out/fingerprints.json
          git commit -m "probe: fingerprints (all sets)" || true
          git push origin HEAD:debug/video-fp
