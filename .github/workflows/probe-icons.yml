name: probe icons (temp)
on:
  push:
    branches: [claude/project-thread-0d5xru]
    paths: [.github/workflows/probe-icons.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        run: |
          UA='Mozilla/5.0 (compatible; ptcgp-collection-asset-fetch)'
          curl -sS -A "$UA" https://www.serebii.net/robots.txt | head -30
          curl -sS -A "$UA" -o s.html -w "serebii icons %{http_code} %{size_download}\n" https://www.serebii.net/tcgpocket/icons.shtml
          echo "img icon count: $(grep -o 'tcgpocket/icon/[^"]*' s.html | sort -u | wc -l)"
          grep -o 'src="[^"]*icon/[^"]*"' s.html | sort -u | head -400 | tr '\n' ' '
          echo
          python3 - <<'PY'
          import re,html
          s=open('s.html',encoding='latin-1').read()
          i=s.find('icon/')
          print(s[i-1500:i+2500])
          PY
          for u in https://www.pokemon-zone.com/robots.txt https://www.pokemon-zone.com/accessories/icons/ ; do
            curl -sS -A "$UA" -o /dev/null -D h.txt -w "$u %{http_code}\n" "$u"; grep -i cf-mitigated h.txt || true; done
