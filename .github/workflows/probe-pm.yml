name: probe-pm
on: push
permissions: { contents: write }
jobs:
  p:
    if: "!contains(github.event.head_commit.message, 'probe-data')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe/out; A="ptcgp-collection-build"
          curl -sS -A "$A" -D probe/out/robots.hdr -o probe/out/robots.txt https://www.pokekalos.fr/robots.txt || true
          sleep 1
          for u in https://www.pokekalos.fr/jeux/pocket/extensions/ https://www.pokekalos.fr/jeux/pocket/extensions/fusion-double.html https://www.pokekalos.fr/jeux/pocket/ ; do
            n=$(echo "$u" | tr -c 'a-z0-9\n' _)
            curl -sS -A "$A" -D probe/out/$n.hdr -o probe/out/$n.html "$u" || true
            grep -o 'https\?://[^"'"'"' )]*boosters/[^"'"'"' )]*' probe/out/$n.html | sort -u > probe/out/$n.boosters.txt || true
            sleep 1
          done
          curl -sS -A "$A" -I -o probe/out/ex.hdr "https://www.media.pokekalos.fr/img/jeux/pocket/extensions/fusion-double/boosters/fusion-double-mega-mewtwo-x.png" || true
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -m "probe-data" ; git push
