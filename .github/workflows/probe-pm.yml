name: probe-pm
on: push
permissions: { contents: write }
jobs:
  p:
    if: "!contains(github.event.head_commit.message, 'probe-data')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          for u in https://www.serebii.net/tcgpocket/items.shtml https://www.serebii.net/tcgpocket/emblems.shtml; do n=$(basename $u .shtml); curl -sSL -A "Mozilla/5.0 ptcgp-collection" -o probe/serebii-$n.html "$u"; done
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -m "probe-data"; git push
