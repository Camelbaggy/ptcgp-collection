name: probe-pm
on: push
permissions: { contents: write }
jobs:
  p:
    if: "!contains(github.event.head_commit.message, 'probe-data')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; i=10
          for u in https://play.limitlesstcg.com/robots.txt "https://play.limitlesstcg.com/api/tournaments?game=POCKET&limit=5" https://docs.limitlesstcg.com/developer/tournaments "https://play.limitlesstcg.com/decks?game=POCKET" ; do
            i=$((i+1)); code=$(curl -sSL -A "Mozilla/5.0 ptcgp-collection" -o probe/$i.html -w "%{http_code}" "$u" || echo ERR); echo "$i $code $(wc -c < probe/$i.html) $u" >> probe/index.txt
          done
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -m "probe-data"; git push
