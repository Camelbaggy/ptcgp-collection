name: probe-pm
on: push
permissions: { contents: write }
jobs:
  p:
    if: "!contains(github.event.head_commit.message, 'probe-data')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          U=https://assets.pokemon-zone.com/game-assets/UI/Textures/System/ItemIcons/Currency/POKEGOLD.webp
          curl -sS -o /dev/null -D - -A "Mozilla/5.0 (Linux; Android 14) Chrome/130" -H "Referer: https://camelbaggy.github.io/" -H "Origin: https://camelbaggy.github.io" "$U" > probe/asset-headers.txt 2>&1 || true
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -m "probe-data"; git push
