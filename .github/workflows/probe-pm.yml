name: probe-pm
on: push
permissions: { contents: write }
jobs:
  p:
    if: "!contains(github.event.head_commit.message, 'probe-data')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe/dump; A="ptcgp-collection (+https://github.com/Camelbaggy/ptcgp-collection)"
          for p in 1 2; do curl -sS -A "$A" -o probe/dump/list$p.json "https://play.limitlesstcg.com/api/tournaments?game=POCKET&limit=100&page=$p"; sleep 1; done
          python3 -c "
          import json
          ts=json.load(open('probe/dump/list1.json'))+json.load(open('probe/dump/list2.json'))
          print('\n'.join(t['id'] for t in ts if t['date']>='2026-10-27'))" > ids.txt
          for id in $(cat ids.txt); do for k in details standings pairings; do curl -sS -A "$A" -o probe/dump/$id.$k.json "https://play.limitlesstcg.com/api/tournaments/$id/$k"; sleep 0.3; done; done
          tar czf probe/dump.tgz -C probe dump; rm -rf probe/dump
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -m "probe-data"; git push
