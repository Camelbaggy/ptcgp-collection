name: probe-rae
on: push
permissions: { contents: write }
jobs:
  p:
    if: "!contains(github.event.head_commit.message, 'probe-data')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          curl -sSL -A "Mozilla/5.0 ptcgp-collection" -o probe/event-fr.html -w "%{http_code}\n" https://ptcgp.raenonx.cc/fr/event || true
          curl -sSL -A "Mozilla/5.0 ptcgp-collection" -o probe/robots.txt https://ptcgp.raenonx.cc/robots.txt || true
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -m "probe-data"; git push
