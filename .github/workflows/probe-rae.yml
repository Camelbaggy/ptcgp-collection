name: probe-rae
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          curl -sSL -A "Mozilla/5.0 ptcgp-collection" -o out/event-fr.html -w "%{http_code}\n" https://ptcgp.raenonx.cc/fr/event || true
          curl -sSL -A "Mozilla/5.0 ptcgp-collection" -o out/robots.txt -w "%{http_code}\n" https://ptcgp.raenonx.cc/robots.txt || true
      - uses: actions/upload-artifact@v4
        with: { name: rae, path: out }
