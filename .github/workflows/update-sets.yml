name: Update sets (new expansions)

# Every day at 06:15 UTC (and hourly during the 3 days after an expansion release date listed in
# public/data/releases.json): compare public/data with the community dataset and open a PR when a new
# expansion / new cards appeared. The PR is reviewed and merged by a human, which triggers the deploy.
on:
  schedule:
    # Hourly trigger; the job exits early unless it is the 06:15 run or we are in a release window.
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-sets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Release window check (daily 06:15 UTC, or [release, release + 3 d])
        id: gate
        run: node scripts/release-window.mjs ${{ github.event_name == 'workflow_dispatch' && '--always' || '' }}

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Fetch new sets (community dataset + TCGdex for French names)
        if: steps.gate.outputs.run == 'true'
        run: node scripts/update-sets.mjs --summary "$RUNNER_TEMP/summary.md"

      - name: Refresh Japanese asset names (event cosmetics naming, never fatal)
        if: steps.gate.outputs.run == 'true'
        run: node scripts/build-jp-names.mjs || true

      # Les PR créées avec GITHUB_TOKEN ne déclenchent pas ci.yml : mêmes contrôles ici, avant d'ouvrir la PR.
      - name: Type-check, tests and build on the updated data
        if: steps.gate.outputs.run == 'true'
        run: |
          npx tsc -b
          npx vitest run
          npm run build

      - name: Open a pull request when public/data changed
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- public/data; then
            echo "Nothing new."
            exit 0
          fi
          branch="auto/new-sets-$(date -u +%Y-%m-%d)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            branch="$branch-$(date -u +%H%M)"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/data
          git commit -m "Données : nouvelles extensions / cartes (mise à jour automatique)"
          git push origin "$branch"
          {
            echo "Mise à jour automatique des données depuis la base communautaire PTCGP."
            echo
            echo "### Changements"
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "### À vérifier avant de fusionner"
            echo "- Les **taux d'obtention marqués « estimés »** sont une copie de l'extension voisine (affichés « Taux estimés — à vérifier » dans l'app). Après la fusion, l'accueil proposera de les saisir ou de les corriger."
            echo "- Les noms de cartes restés en anglais seront traduits automatiquement dès que TCGdex les publie (nouvelle PR)."
            echo "- Les images, logos et emblèmes sont récupérés par le déploiement (\`deploy.yml\`)."
            echo
            echo "La fusion de cette PR déclenche le déploiement."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "Nouvelles extensions : mise à jour des données ($(date -u +%Y-%m-%d))" \
            --body-file "$RUNNER_TEMP/body.md"
